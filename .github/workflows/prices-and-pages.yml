name: Preise aktualisieren und Pages bereitstellen

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "preispilot-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: MPREIS-Daten aktualisieren
        run: python scripts/update_mpreis.py

      - name: Öffentliche Preisdaten speichern
        shell: bash
        run: |
          git config user.name "preis-pilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
          else
            git commit -m "chore: Preisdaten aktualisieren"
            git push
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische App zusammenstellen
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js live-mpreis.js manifest.webmanifest sw.js .nojekyll _site/
          cp -R assets _site/assets
          cp -R data _site/data

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
