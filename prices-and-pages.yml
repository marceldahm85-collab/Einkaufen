name: Preise aktualisieren und Pages bereitstellen

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "preispilot-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: MPREIS-Daten aktualisieren
        run: python scripts/update_mpreis.py

      - name: MPREIS-Datenbestand prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/mpreis.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          count = len(data.get("products") or [])

          print(f"MPREIS-Produkte in data/mpreis.json: {count}")

          if count < 100:
              raise SystemExit(
                  "MPREIS-Datenbestand ist leer oder unplausibel klein. "
                  "Deployment wird abgebrochen."
              )
          PY

      - name: MPREIS-Aktionen ergänzen
        run: python scripts/update_mpreis_actions.py

      - name: SPAR-Daten aktualisieren
        run: python scripts/update_spar.py

      - name: SPAR-Datenbestand prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/spar.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          count = len(data.get("products") or [])

          print(f"SPAR-Produkte in data/spar.json: {count}")

          if count < 100:
              raise SystemExit(
                  "SPAR-Datenbestand ist leer oder unplausibel klein. "
                  "Deployment wird abgebrochen."
              )
          PY

      - name: SPAR-Aktionsfelder analysieren
        run: python scripts/diagnose_spar_promotions.py

      - name: SPAR-Aktionen ergänzen
        run: python scripts/update_spar_actions.py

      - name: Öffentliche Preisdaten speichern
        shell: bash
        run: |
          git config user.name "preis-pilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
          else
            git commit -m "chore: Preisdaten aktualisieren"
            git push
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische App zusammenstellen
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js live-mpreis.js live-spar.js manifest.webmanifest sw.js _site/
          cp -R assets _site/assets
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
